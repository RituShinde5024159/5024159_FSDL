<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative Interactive App</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        font-family: 'Segoe UI', sans-serif;
        background: radial-gradient(circle at top, #0f2027, #203a43, #2c5364);
        color: white;
    }

    h1 {
        text-align: center;
        margin-top: 20px;
        letter-spacing: 2px;
    }

    #counter {
        text-align: center;
        font-size: 20px;
        margin-top: 10px;
    }

    .bubble {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        animation: floatUp 2s ease-out forwards;
        box-shadow: 0 0 20px rgba(255,255,255,0.7);
    }

    @keyframes floatUp {
        0% {
            transform: translateY(0) scale(1);
            opacity: 1;
        }
        100% {
            transform: translateY(-200px) scale(1.5);
            opacity: 0;
        }
    }

    .controls {
        position: fixed;
        bottom: 20px;
        width: 100%;
        display: flex;
        justify-content: center;
        gap: 20px;
    }

    button {
        padding: 12px 20px;
        border: none;
        border-radius: 30px;
        background: linear-gradient(45deg, #ff6b6b, #f06595);
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        transform: scale(1.1);
        box-shadow: 0 0 15px #ff6b6b;
    }

    .mode-dark {
        background: radial-gradient(circle at top, #000000, #1a1a1a);
    }
</style>
</head>

<body>

<h1>✨ Interactive Bubble World ✨</h1>
<div id="counter">Bubbles Created: 0</div>

<div class="controls">
    <button onclick="toggleMode()">Toggle Mode</button>
    <button onclick="clearBubbles()">Clear</button>
</div>

<script>
let count = 0;
let darkMode = false;

document.addEventListener("click", function(e) {
    createBubble(e.clientX, e.clientY);
});

function createBubble(x, y) {
    const bubble = document.createElement("div");
    bubble.classList.add("bubble");

    const size = Math.random() * 40 + 20;
    bubble.style.width = size + "px";
    bubble.style.height = size + "px";
    bubble.style.left = x - size/2 + "px";
    bubble.style.top = y - size/2 + "px";

    const colors = ["#ff6b6b", "#4dabf7", "#51cf66", "#ffd43b", "#f783ac"];
    bubble.style.background = colors[Math.floor(Math.random() * colors.length)];

    document.body.appendChild(bubble);

    setTimeout(() => {
        bubble.remove();
    }, 2000);

    count++;
    document.getElementById("counter").innerText = "Bubbles Created: " + count;
}

function toggleMode() {
    darkMode = !darkMode;
    document.body.classList.toggle("mode-dark");
}

function clearBubbles() {
    document.querySelectorAll(".bubble").forEach(b => b.remove());
    count = 0;
    document.getElementById("counter").innerText = "Bubbles Created: 0";
}
</script>

</body>
</html>
