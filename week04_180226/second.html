<!DOCTYPE html>
<html>
<head>
    <title>JavaScript All Concepts Demo</title>
</head>
<body>

    <h2>JavaScript Concepts Demo</h2>
    <button onclick="runProgram()">Click Me</button>
    <p id="output"></p>

    <script>
        // Function (Event will call this function)
        function runProgram() {

            // Variables
            let a = 10;
            let b = 5;

            // Operators
            let sum = a + b;      // Arithmetic operator
            let isGreater = a > b; // Comparison operator

            let result = "";

            // Conditional Statement
            if (isGreater) {
                result += "a is greater than b<br>";
            } else {
                result += "b is greater than or equal to a<br>";
            }

            // Loop
            result += "Numbers from 1 to 5:<br>";
            for (let i = 1; i <= 5; i++) {
                result += i + " ";
            }

            result += "<br><br>";

            // Class
            class Student {
                constructor(name, marks) {
                    this.name = name;
                    this.marks = marks;
                }

                // Method (Function inside class)
                getDetails() {
                    return "Student Name: " + this.name + 
                           "<br>Marks: " + this.marks;
                }
            }

            // Object creation
            let student1 = new Student("Ritu", 90);

            result += student1.getDetails();

            // Display output
            document.getElementById("output").innerHTML = result;
        }
    </script>

</body>
</html>
